<style>
  :root { color-scheme: dark; --ice: #C2E1FC; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;

  h1 { margin: 0; font-size: clamp(34px, 6vw, 60px); font-weight: 300; font-stretch: 125%; letter-spacing: -.035em; line-height: 1.02; }

  .btn:hover { background: #fff; box-shadow: 0 0 0 5px rgba(194, 225, 252, .12), 0 16px 44px -12px rgba(194, 225, 252, .65); }
  a:focus-visible { outline: 2px solid var(--ice); outline-offset: 4px; }
  small { display: block; margin-top: 24px; font-size: 13px; color: rgba(232, 240, 248, .54); }
  small a { color: inherit; text-underline-offset: 3px; text-decoration-color: rgba(194, 225, 252, .35); }

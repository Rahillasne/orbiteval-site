<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">

<style>
  :root{
    --bg:#F4F3F0; --surface:#FFFFFF; --surface-2:#FAF9F7;
    --ink:#14161A; --muted:#666B74; --faint:#95999F;
    --line:#E5E3DE; --line-soft:#EFEDE9;
    --pinned:#1C6B4B; --pinned-bg:#E8F2ED;
    --tied:#A8482A; --tied-bg:#FAEDE8;
    --reach:#7A5B14; --reach-bg:#FBF2DD;
    --band:#C6D3E6; --band-lit:#8DA6C9; --band-gen:#DDE4EE;
    --dot:#14161A; --brand:#E08C1F;
    --sb:236px; --rail:214px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  #root{min-height:100vh}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;
    border-radius:4px}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
  .sidebar{background:var(--bg);border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:18px;padding:18px 14px;position:sticky;top:0;
    height:100vh;overflow-y:auto}
  .brandmark{display:flex;align-items:center;gap:9px;padding:4px 8px 2px}
  .brandmark .glyph{width:22px;height:22px;border-radius:5px;background:var(--ink);
    display:grid;place-items:center;flex:none}
  .brandmark .glyph i{width:7px;height:7px;border-radius:50%;background:var(--brand);
    display:block;font-style:normal}
  .brandmark b{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.12rem;
    letter-spacing:.01em}
  .brandmark span{font-size:.7rem;color:var(--faint);letter-spacing:.13em;text-transform:uppercase}

  .navlist{display:flex;flex-direction:column;gap:2px}
  .navlist button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;
    font-size:.9rem;color:var(--muted);text-align:left;width:100%}
  .navlist button:hover{background:#EDEBE6}
  .navlist button[aria-current="true"]{background:var(--surface);color:var(--ink);
    font-weight:500;box-shadow:0 1px 2px rgba(20,22,26,.05)}
  .navlist .ic{width:15px;text-align:center;color:var(--faint);flex:none}
  .navlist button[aria-current="true"] .ic{color:var(--ink)}

  .sbcard{margin-top:auto;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:7px}
  .sbcard h4{margin:0;font-size:.84rem;font-weight:600}
  .sbcard p{margin:0;font-size:.76rem;color:var(--muted);line-height:1.45}
  .sbcard code{font-family:"JetBrains Mono",Menlo,monospace;font-size:.72rem;
    background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
    padding:5px 7px;display:block;overflow-x:auto;white-space:nowrap}

  /* ---------- top bar ---------- */
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:8px;padding:11px 22px;
    border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5;
    flex-wrap:wrap}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tabs button{padding:6px 13px;border-radius:8px;font-size:.88rem;color:var(--muted)}
  .tabs button:hover{background:#EDEBE6}
  .tabs button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:500;
    border:1px solid var(--line)}
  .grow{flex:1}
  .cta{background:var(--ink);color:#fff;border-radius:8px;padding:7px 15px;font-size:.85rem;
    font-weight:500;white-space:nowrap;text-decoration:none}
  .cta:hover{background:#2A2E36}
  .topnote{font-size:.78rem;color:var(--faint);margin-right:6px}

  .body{display:grid;grid-template-columns:var(--rail) 1fr;min-width:0;align-items:start}
  .rail{padding:20px 16px;display:flex;flex-direction:column;gap:22px;
    border-right:1px solid var(--line);position:sticky;top:53px}
  .rail h5{margin:0 0 8px;font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  .seg{display:flex;flex-direction:column;gap:2px}
  .seg button{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 10px;border-radius:7px;font-size:.86rem;color:var(--muted);width:100%;
    text-align:left;line-height:1.3}
  .seg button:hover{background:#EDEBE6}
  .seg button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:500;
    border:1px solid var(--line)}
  .seg .tick{color:var(--pinned);font-weight:700;flex:none}
  .seg small{display:block;font-size:.72rem;color:var(--faint);font-weight:400}

  .content{padding:26px 22px 70px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .pagehead{display:flex;flex-direction:column;gap:9px}
  .pagehead h1{font-family:Newsreader,Georgia,serif;font-weight:400;
    font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.1}
  .pagehead .sub{color:var(--muted);max-width:74ch;font-size:.95rem;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:7px 16px;font-size:.8rem;color:var(--muted)}
  .chips span{display:inline-flex;align-items:center;gap:6px}
  .chips b{font-weight:500;color:var(--ink);font-family:"JetBrains Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:7px;background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:6px 11px;min-width:190px}
  .search input{border:0;outline:0;background:none;font:inherit;font-size:.85rem;width:100%;
    color:var(--ink)}
  .search input::placeholder{color:var(--faint)}
  .pillbar{display:flex;gap:3px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:3px}
  .pillbar button{padding:4px 11px;border-radius:6px;font-size:.82rem;color:var(--muted)}
  .pillbar button[aria-current="true"]{background:var(--ink);color:#fff;font-weight:500}

  /* ---------- table ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:11px;
    overflow:hidden}
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:900px}
  thead th{text-align:left;padding:9px 13px;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);font-weight:600;
    border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--ink)}
  thead th .ar{color:var(--ink);margin-left:3px}
  tbody td{padding:9px 13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-family:"JetBrains Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .model{display:flex;flex-direction:column;gap:1px;min-width:0}
  .model .nm{font-family:"JetBrains Mono",Menlo,monospace;font-size:.85rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30ch}
  .model .org{font-size:.74rem;color:var(--faint)}
  .rk{font-family:"JetBrains Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
    color:var(--muted)}
  .sc{font-family:"JetBrains Mono",Menlo,monospace;font-variant-numeric:tabular-nums;
    font-weight:500}
  .ci{font-family:"JetBrains Mono",Menlo,monospace;font-size:.74rem;color:var(--faint);
    margin-left:5px;font-variant-numeric:tabular-nums}

  .spread{display:flex;align-items:center;gap:6px;min-width:104px}
  .spread .e{font-family:"JetBrains Mono",Menlo,monospace;font-size:.76rem;color:var(--muted);
    font-variant-numeric:tabular-nums;width:1.5rem;text-align:center;flex:none}
  .spread .ln{position:relative;flex:1;height:9px;min-width:44px}
  .spread .ln::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
    background:var(--line);transform:translateY(-50%)}
  .spread .seg2{position:absolute;top:50%;height:3px;border-radius:2px;background:var(--band-lit);
    transform:translateY(-50%)}
  .spread .kn{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;
    background:var(--dot);transform:translate(-50%,-50%)}
  .pin .spread .seg2{background:var(--pinned)}
  .pin .spread .kn{background:var(--pinned)}
  .pin .model .nm{font-weight:600}

  .iv{position:relative;height:16px;min-width:150px}
  .iv .gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-soft)}
  .iv .gen{position:absolute;top:50%;height:12px;transform:translateY(-50%);
    border:1px solid var(--band-gen);border-radius:3px}
  .iv .bar{position:absolute;top:50%;height:6px;transform:translateY(-50%);
    background:var(--band);border-radius:2px}
  .pin .iv .bar{background:var(--band-lit)}
  .iv .pt{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:var(--dot);
    transform:translate(-50%,-50%)}
  .iv .off{position:absolute;top:50%;left:0;width:14%;height:6px;transform:translateY(-50%);
    background:linear-gradient(90deg,var(--band),transparent);border-radius:2px}
  .iv .offtx{position:absolute;top:50%;left:16%;transform:translateY(-50%);font-size:.68rem;
    color:var(--faint);font-family:"JetBrains Mono",Menlo,monospace;white-space:nowrap}

  .tag{display:inline-block;font-family:"JetBrains Mono",Menlo,monospace;font-size:.7rem;
    padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:500}
  .tag.pinned{background:var(--pinned-bg);color:var(--pinned)}
  .tag.tied{background:var(--tied-bg);color:var(--tied)}
  .tag.reach{background:var(--reach-bg);color:var(--reach)}

  .note{background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--ink);border-radius:9px;padding:12px 14px;font-size:.87rem;
    color:var(--muted);max-width:92ch}
  .note.warn{border-left-color:var(--tied)}
  .note.good{border-left-color:var(--pinned)}
  .note strong{color:var(--ink);font-weight:600}
  .note p{margin:0}

  .prose{display:flex;flex-direction:column;gap:12px;max-width:74ch}
  .prose h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:1.5rem}
  .prose h3{font-size:.95rem;font-weight:600;margin-top:6px}
  .prose p{margin:0;color:var(--muted);font-size:.92rem}
  .prose strong{color:var(--ink)}
  .prose code{font-family:"JetBrains Mono",Menlo,monospace;font-size:.84em;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

  .empty{padding:38px 16px;text-align:center;color:var(--faint);font-size:.88rem}

  @media (max-width:1000px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:static;height:auto;flex-direction:row;align-items:center;
      border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
    .sbcard{display:none}
    .navlist{flex-direction:row}
    .body{grid-template-columns:1fr}
    .rail{position:static;border-right:0;border-bottom:1px solid var(--line);
      flex-direction:row;flex-wrap:wrap;gap:18px}
    .rail>div{min-width:160px;flex:1}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    [1,2,2.5,5,10].some(function(m){ if(span/(step*m)<=6){step=step*m;return true;} return false;});
    var out=[]; for(var v=Math.ceil(d.lo/step)*step; v<=d.hi; v+=step){
      out.push(Math.round(v*1e6)/1e6);} return out;
  }

  function Spread(p){
    var n=p.total, pc=function(r){ return n<=1?50:((r-1)/(n-1))*100; };
    return h('div',{className:'spread'},
      h('span',{className:'e'}, p.best),
      h('div',{className:'ln'},
        h('div',{className:'seg2',style:{left:pc(p.best)+'%',
          width:Math.max(2,pc(p.worst)-pc(p.best))+'%'}}),
        h('div',{className:'kn',style:{left:pc(p.order)+'%'}})),
      h('span',{className:'e'}, p.worst));
  }

  function Interval(p){
    var dom=p.dom, x=p.p, off = x.ci[1] < dom.floor, kids=[];
    (p.ticks||[]).forEach(function(t,i){
      kids.push(h('div',{className:'gridline',key:'g'+i,style:{left:dom.pos(t)+'%'}}));
    });
    if(off){
      kids.push(h('div',{className:'off',key:'o'}));
      kids.push(h('div',{className:'offtx',key:'ot'},
        '← '+fmt(x.ci[0],0)+' to '+fmt(x.ci[1],0)));
    } else {
      if(p.gen && x.gen_ci){
        kids.push(h('div',{className:'gen',key:'gn',style:{left:dom.pos(x.gen_ci[0])+'%',
          width:Math.max(1,dom.pos(x.gen_ci[1])-dom.pos(x.gen_ci[0]))+'%'}}));
      }
      kids.push(h('div',{className:'bar',key:'b',style:{left:dom.pos(x.ci[0])+'%',
        width:Math.max(1,dom.pos(x.ci[1])-dom.pos(x.ci[0]))+'%'}}));
      kids.push(h('div',{className:'pt',key:'p',style:{left:dom.pos(x.score)+'%'}}));
    }
    return h('div',{className:'iv'}, kids);
  }

  function Th(p){
    return h('th',{className:(p.num?'num ':'')+(p.sort?'sortable':''),
      onClick:p.sort?function(){p.onSort(p.k);}:null, title:p.title||null},
      p.label, p.active? h('span',{className:'ar'}, p.desc?'↓':'↑') : null);
  }

  function Ranking(p){
    var b=p.board, st=p.sort;
    var gen = b.kind==='suite' && b.policies[0] && b.policies[0].gen_ci;
    var rows = useMemo(function(){
      var r = b.policies.filter(function(x){
        return !p.query || x.policy.toLowerCase().indexOf(p.query.toLowerCase())>=0; });
      return r.slice().sort(function(x,y){
        var vx,vy,k=st.key;
        if(k==='score'){vx=x.score;vy=y.score;}
        else if(k==='n'){vx=x.n;vy=y.n;}
        else if(k==='width'){vx=x.ci[1]-x.ci[0];vy=y.ci[1]-y.ci[0];}
        else if(k==='spread'){vx=x.worst_rank-x.best_rank;vy=y.worst_rank-y.best_rank;}
        else {vx=x.order;vy=y.order;}
        return st.desc ? vy-vx : vx-vy;
      });
    },[b,st.key,st.desc,p.query]);

    var dom = useMemo(function(){return domainOf(b.policies, gen);},[b,gen]);
    var ticks = useMemo(function(){return ticksOf(dom);},[dom]);
    var pct = b.kind==='suite';
    var unit = (b.source&&b.source.unit)||'observations';

    if(!rows.length) return h('div',{className:'card'},
      h('div',{className:'empty'},'No models match “'+p.query+'”.'));

    return h('div',{className:'card'},
      h('div',{className:'tblwrap'},
        h('table',null,
          h('thead',null,h('tr',null,
            h(Th,{label:'Rank',k:'rank',sort:true,active:st.key==='rank',desc:st.desc,onSort:p.onSort}),
            h(Th,{label:'Rank spread',k:'spread',sort:true,active:st.key==='spread',desc:st.desc,
                  onSort:p.onSort,title:'Best and worst rank consistent with the 95% interval'}),
            h(Th,{label:'Model',k:'model'}),
            h(Th,{label:pct?'Success rate':'Arena score',k:'score',num:true,sort:true,
                  active:st.key==='score',desc:st.desc,onSort:p.onSort}),
            h(Th,{label:'95% interval '+fmt(dom.lo,0)+(pct?'%':'')+' \u2192 '
                  +fmt(dom.hi,0)+(pct?'%':''),k:'iv'}),
            h(Th,{label:unit,k:'n',num:true,sort:true,active:st.key==='n',desc:st.desc,
                  onSort:p.onSort}),
            h(Th,{label:'Verdict',k:'v'}))),
          h('tbody',null, rows.map(function(x){
            var w=(x.ci[1]-x.ci[0])/2;
            return h('tr',{key:x.policy,className:x.pinned?'pin':''},
              h('td',{className:'rk'}, x.order),
              h('td',null, h(Spread,{best:x.best_rank,worst:x.worst_rank,order:x.order,
                                     total:b.n_policies})),
              h('td',null, h('div',{className:'model'},
                h('span',{className:'nm',title:x.policy}, x.policy),
                h('span',{className:'org'}, x.pinned? 'rank fixed by the data'
                  : 'consistent with ranks '+x.best_rank+'–'+x.worst_rank))),
              h('td',{className:'num'},
                h('span',{className:'sc'}, fmt(x.score, pct?1:0)+(pct?'%':'')),
                h('span',{className:'ci'}, '+'+fmt(w,1)+'/−'+fmt(w,1))),
              h('td',null, h(Interval,{p:x,dom:dom,ticks:ticks,gen:gen})),
              h('td',{className:'num'}, big(x.n)),
              h('td',null, x.pinned
                ? h('span',{className:'tag pinned'},'pinned')
                : h('span',{className:'tag tied'},
                    (x.worst_rank-x.best_rank+1)+'-way tie')));
          })))));
  }

  function Resolution(p){
    var b=p.board, pct=b.kind==='suite';

  function Evidence(p){
    var b=p.board, pols=b.policies.filter(function(x){return x.n>0;});
    var W=780, H=390, M={t:18,r:20,b:48,l:58};
    var xs=pols.map(function(x){return Math.log10(Math.max(1,x.n));});
    var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
    if(x1-x0<0.35){x0-=0.25;x1+=0.25;}
    var y0=Math.min.apply(null,pols.map(function(x){return x.ci[0];}));
    var y1=Math.max.apply(null,pols.map(function(x){return x.ci[1];}));
    var ypad=(y1-y0)*0.08||1; y0-=ypad; y1+=ypad;
    var px=function(v){return M.l+(v-x0)/((x1-x0)||1)*(W-M.l-M.r);};
    var py=function(v){return M.t+(1-(v-y0)/((y1-y0)||1))*(H-M.t-M.b);};
    var pct=b.kind==='suite';
    var xt=[]; for(var e=Math.floor(x0);e<=Math.ceil(x1);e++){ if(e>=0) xt.push(e); }
    var yt=ticksOf({lo:y0,hi:y1});
    var sup=function(n){ return String(n).split('').map(function(c){
      return '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]; }).join(''); };

    return h(F,null,
      h('div',{className:'note'}, h('p',null,
        h('strong',null,'Evidence, not just score. '),
        'Vertical bars are 95% intervals. Models to the left were measured with less data, so ',
        'their position is a weaker claim — a high point estimate on a long bar is worth ',
        'less than a slightly lower one on a short bar.')),
      h('div',{className:'card',style:{padding:'14px'}},
        h('div',{style:{overflowX:'auto'}},
          h('svg',{viewBox:'0 0 '+W+' '+H, width:'100%',
            style:{maxWidth:'100%',display:'block',minWidth:'560px'},
            role:'img','aria-label':'Score against evaluation budget with 95% intervals'},
            yt.map(function(t,i){ return h('g',{key:'y'+i},
              h('line',{x1:M.l,x2:W-M.r,y1:py(t),y2:py(t),stroke:'#EFEDE9',strokeWidth:1}),
              h('text',{x:M.l-9,y:py(t)+4,textAnchor:'end',fontSize:11,fill:'#95999F',
                fontFamily:'JetBrains Mono, monospace'}, fmt(t,0)+(pct?'%':''))); }),
            xt.map(function(t,i){ return h('g',{key:'x'+i},
              h('line',{x1:px(t),x2:px(t),y1:M.t,y2:H-M.b,stroke:'#EFEDE9',strokeWidth:1}),
              h('text',{x:px(t),y:H-M.b+18,textAnchor:'middle',fontSize:11,fill:'#95999F',
                fontFamily:'JetBrains Mono, monospace'}, t===0?'1':('10'+sup(t)))); }),
            pols.map(function(x,i){
              var cx=px(Math.log10(Math.max(1,x.n)));
              return h('g',{key:i},
                h('line',{x1:cx,x2:cx,y1:py(x.ci[1]),y2:py(x.ci[0]),
                  stroke:x.pinned?'#1C6B4B':'#C6D3E6',strokeWidth:3,strokeLinecap:'round'}),
                h('circle',{cx:cx,cy:py(x.score),r:4,fill:x.pinned?'#1C6B4B':'#14161A'}),
                x.pinned ? h('text',{x:cx+9,y:py(x.score)+4,fontSize:11,fill:'#1C6B4B',
                  fontFamily:'JetBrains Mono, monospace'}, x.policy) : null); }),
            h('text',{x:M.l+(W-M.l-M.r)/2,y:H-6,textAnchor:'middle',fontSize:11.5,fill:'#666B74'},
              'Evaluation budget behind the estimate ('
              +((b.source&&b.source.unit)||'observations')+', log scale)'),
            h('text',{x:15,y:M.t+(H-M.t-M.b)/2,fontSize:11.5,fill:'#666B74',textAnchor:'middle',
              transform:'rotate(-90 15 '+(M.t+(H-M.t-M.b)/2)+')'},
              pct?'Suite success rate':'Arena score')))));
  }

  function Method(){
    return h('div',{className:'prose'},
      h('h2',null,'How these boards are computed'),
      h('p',null,'Every board answers one question: what does this benchmark’s own data ',

      h('h3',null,'Two measurement models'),
      h('p',null,h('strong',null,'Pairwise arenas. '),'Bradley–Terry by Newton iteration ',
        'under a sum-to-zero constraint, ties as half a win each. Intervals in closed form from ',
        'the pseudo-inverse of the Fisher information, which for Bradley–Terry is a graph ',
        'Laplacian whose null space is exactly the constraint direction. Validated against a ',
        '2,000-sample bootstrap (closed-form SEs within 1.03–1.13×, median 1.09) and ',
        'against raw head-to-head rates.'),
      h('p',null,h('strong',null,'Fixed task suites. '),'The suite mean is a sum of independent ',
        'binomials, so its sampling variance is ',
        h('code',null,'Σ p(1−p)/nₜ ÷ T²'),'. Cells may carry different ',
        'budgets — RoboDojo runs 12 tasks at 25 episodes and 8 at 50 — so trial counts ',
        'are declared per cell. Where the data allows, the interval for ',h('em',null,'new'),
        ' tasks drawn from the same pool is also computed; it is several times wider and is the ',
        'honest answer to “which model is better in general?”'),
      h('h3',null,'Rank spread'),
      h('p',null,'Best rank is one plus the number of models clearly ahead; worst rank is one ',
        'plus the number that could be ahead. Two models are tied when their spreads overlap. ',
        'This follows LMArena’s definition, so the boards read the same way.'),
      h('h3',null,'Guards, each found the hard way'),
      h('p',null,'Policies with too few comparisons are excluded rather than ranked — one ',
        'that wins or loses all of them sends ability to infinity and, abilities being centred, ',
        'drags every other model with it. Suite means are computed only over full task coverage. ',
        'The ridge that keeps the optimiser stable is kept out of the covariance, where it would ',
        'fill the null direction and inflate every interval by ',h('code',null,'1/√(2λ)'),
        '. Trial counts are inferred from the reported data rather than read from a paper. And an ',
        'exactly zero gap is carried as unresolvable, not as a very large number.'),
      h('h3',null,'Limits'),
      h('p',null,'These fits are deliberately plainer than the benchmarks’ own richer models ',
        '— RoboArena adds task-difficulty and policy–task terms with a Davidson tie ',
        'extension. The question here is not what the ranking is, but whether the data can ',
        'resolve it, and interval width is driven by observation counts rather than tie ',
        'parameterisation. A fuller model moves point estimates; it does not close a ',
        'thousandfold gap.'));
  }

              h('span',{className:'mono'}, ex.k+'/'+ex.n),
              ' carries a 95% interval of ',
              h('span',{className:'mono'},'['+ex.ci[0].toFixed(0)+'%, '+ex.ci[1].toFixed(0)+'%]'),
              ' — '+Math.round(ex.width)+'pp wide. The reason to run many '
              +(board.cell_label||'task')+'s is to see where a model is strong; that is exactly ',
              'the part this budget cannot support.')) : null,

        board.dropped && board.dropped.length
          ? h('div',{className:'note'}, h('p',null,
              h('strong',null, board.dropped.length+' further '
                +(board.dropped.length===1?'entry is':'entries are')+' excluded, not ranked. '),
              board.dropped.slice(0,3).map(function(x){return x.policy;}).join(', '),
              board.dropped.length>3 ? ' and '+(board.dropped.length-3)+' more' : '',
              ' — '+board.dropped[0].reason+'. Their rank is unidentified, not low. A ',
              'leaderboard that silently drops entrants is the failure this project exists to ',
              'object to, so they are named here instead.')) : null);
    }

    var rail = h('aside',{className:'rail'},
      page==='boards' ? h('div',null,
        h('h5',null,'View as'),
        h('div',{className:'seg'},
          [['ranking','Ranking','Scores, intervals, ties'],
           ['resolution','Resolution','Cost of breaking each tie'],
           ['evidence','Evidence','Score against budget']].map(function(v){
            return h('button',{key:v[0],'aria-current':view===v[0],
              onClick:function(){setView(v[0]);}},
              h('span',null, v[1], h('small',null,v[2])),
              view===v[0]? h('span',{className:'tick'},'✓') : null); }))) : null,
      page==='boards' && grp.boards.length>1 ? h('div',null,
        h('h5',null,'Track'),
        h('div',{className:'seg'}, grp.boards.map(function(bd){
          return h('button',{key:bd.key,'aria-current':key===bd.key,
            onClick:function(){goto(bd.key);}},
            h('span',null, bd.label,
              h('small',null, big(DATA.boards[bd.key].n_policies)+' models')),
            key===bd.key? h('span',{className:'tick'},'✓') : null); }))) : null,
      h('div',null,
        h('h5',null,'All boards'),
        h('div',{className:'seg'}, DATA.order.map(function(k){
          var bd=DATA.boards[k];
          return h('button',{key:k,'aria-current':page==='boards'&&key===k,
            onClick:function(){goto(k);}},
            h('span',null, bd.source.name,
              h('small',null, bd.pinned+'/'+bd.n_policies+' ranks fixed')),
            page==='boards'&&key===k ? h('span',{className:'tick'},'✓') : null); }))));

    return h('div',{className:'shell'}, sidebar,
      h('div',{className:'main'},
        h('div',{className:'topbar'},
          h('div',{className:'tabs'}, DATA.groups.map(function(g){
            return h('button',{key:g.id,'aria-current':page==='boards'&&group===g.id,
              onClick:function(){setPage('boards');setGroup(g.id);}}, g.label); })),
          h('div',{className:'grow'}),
          h('span',{className:'topnote'},
            big(total)+' observations across '+DATA.order.length+' boards'),
          h('a',{className:'cta',href:'https://orbiteval.com'},'orbiteval.com')),
        h('div',{className:'body'}, rail,
          h('main',{className:'content'}, content))));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
